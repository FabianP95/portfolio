<svg width="80" height="100" viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- React atom: outer ellipses as paths, nucleus, same color palette -->
  <g>
    <!-- Ellipse 1: horizontal -->
    <ellipse cx="40" cy="42" rx="28" ry="10" stroke="url(#paint0_linear_react)" stroke-width="3" fill="none"/>
    <!-- Ellipse 2: rotated 60deg -->
    <ellipse cx="40" cy="42" rx="28" ry="10" stroke="url(#paint0_linear_react)" stroke-width="3" fill="none" transform="rotate(60 40 42)"/>
    <!-- Ellipse 3: rotated 120deg -->
    <ellipse cx="40" cy="42" rx="28" ry="10" stroke="#89BCD9" stroke-width="3" fill="none" transform="rotate(120 40 42)"/>
    <!-- Nucleus -->
    <circle cx="40" cy="42" r="4" fill="url(#paint0_linear_react)"/>
  </g>
  <!-- Label text in same style -->
  <text x="40" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#89BCD9" letter-spacing="1">React</text>
  <defs>
    <linearGradient id="paint0_linear_react" x1="12" y1="32" x2="60" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5496BC"/>
      <stop offset="1" stop-color="#89BCD9"/>
    </linearGradient>
  </defs>
</svg>
